<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Blog</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .form-container {
      background-color: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h2 {
      text-align: center;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Submit Blog</h2>
    <form id="blogForm">
      <label for="title">Blog Title:</label>
      <input type="text" id="title" name="title" required>

      <label for="content">Blog Content:</label>
      <textarea id="content" name="content" required></textarea>

      <button type="submit">Submit</button>
    </form>
    <div id="responseMessage"></div>
  </div>

  <script>
    document.getElementById('blogForm').addEventListener('submit', function(event) {
      event.preventDefault(); 

      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      const blogData = { title, content };

      fetch('https://reqres.in/api/posts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(blogData)
      })
      .then(response => response.json())
      .then(data => {
        document.getElementById('responseMessage').innerText = `Blog submitted! ID: ${data.id}`;
      })
      .catch(error => {
        document.getElementById('responseMessage').innerText = 'Error submitting blog.';
      });
      document.getElementById('blogForm').reset();
    });
  </script>

</body>
</html>
