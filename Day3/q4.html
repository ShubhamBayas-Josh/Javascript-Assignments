<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog User List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .input-container {
      margin: 20px 0;
    }

    input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }

    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border: 1px solid #ddd;
    }

    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <h2>User List</h2>

  <div class="input-container">
    <input type="text" id="searchInput" placeholder="Search by name..." oninput="filterTable()">
    <button onclick="sortTable()">Sort by Name</button>
  </div>

  <div id="tableContainer">
    <table id="userTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const userTableBody = document.getElementById('userTable').getElementsByTagName('tbody')[0];
    let users = [];

    fetch('https://jsonplaceholder.typicode.com/users')
      .then(response => response.json())
      .then(data => {
        users = data;
        renderTable(users);
      })
      .catch(error => {
        alert('Error loading data');
      });

    function renderTable(usersList) {
      userTableBody.innerHTML = '';
      usersList.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.name}</td>
          <td>${user.email}</td>
        `;
        userTableBody.appendChild(row);
      });
    }

    function filterTable() {
      const searchValue = document.getElementById('searchInput').value.toLowerCase();
      const filteredUsers = users.filter(user => user.name.toLowerCase().includes(searchValue));
      renderTable(filteredUsers);
    }

    function sortTable() {
      const sortedUsers = [...users].sort((a, b) => a.name.localeCompare(b.name));
      renderTable(sortedUsers);
    }
  </script>

</body>
</html>
